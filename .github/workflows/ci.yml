name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: >-
          xcodebuild build
          -project DiskVaktNext.xcodeproj
          -scheme DiskVakt
          -configuration Debug
          -derivedDataPath .derivedData
          CODE_SIGNING_ALLOWED=NO
      - name: Test
        run: >-
          xcodebuild test
          -project DiskVaktNext.xcodeproj
          -scheme DiskVakt
          -configuration Debug
          -derivedDataPath .derivedData
          CODE_SIGNING_ALLOWED=NO
